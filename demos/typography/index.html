<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YKMarkdown 排版方案对比</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #69716e;
      --paper: #f2f0e9;
      --card: rgba(255, 255, 255, 0.76);
      --line: rgba(23, 32, 29, 0.12);
      --accent: #ba5637;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(207, 137, 92, 0.16), transparent 28rem),
        radial-gradient(circle at 90% 4%, rgba(76, 119, 102, 0.12), transparent 30rem),
        var(--paper);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
    }

    .shell {
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: end;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(34px, 5vw, 66px);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1.05;
    }

    .intro {
      max-width: 560px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .open-current {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .open-current:hover {
      color: white;
      background: var(--ink);
      transform: translateY(-1px);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .choice {
      appearance: none;
      position: relative;
      min-height: 128px;
      padding: 18px 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      background: var(--card);
      box-shadow: 0 14px 40px rgba(23, 32, 29, .04);
      cursor: pointer;
      text-align: left;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .choice:focus { outline: none; }

    .choice:focus-visible {
      outline: 2px solid var(--swatch);
      outline-offset: 3px;
    }

    .choice::after {
      position: absolute;
      right: -18px;
      bottom: -28px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--swatch);
      content: "";
      opacity: .16;
      transition: transform .25s ease;
    }

    .choice:hover,
    .choice[aria-selected="true"] {
      border-color: color-mix(in srgb, var(--swatch) 58%, transparent);
      box-shadow: 0 18px 50px rgba(23, 32, 29, .09);
      transform: translateY(-2px);
    }

    .choice:hover::after,
    .choice[aria-selected="true"]::after { transform: scale(1.32); }

    .choice-number {
      color: var(--swatch);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .choice strong {
      display: block;
      margin: 8px 0 5px;
      font-size: 18px;
    }

    .choice small {
      display: block;
      max-width: 85%;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(31, 38, 35, .13);
    }

    iframe {
      display: block;
      width: 100%;
      height: min(760px, calc(100vh - 250px));
      min-height: 560px;
      border: 0;
      background: white;
    }

    @media (max-width: 780px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 24px; }
      header { grid-template-columns: 1fr; gap: 18px; }
      .open-current { justify-self: start; }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 104px; }
      iframe { height: 680px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">YKMarkdown · Typography study</p>
        <h1>同一篇文章，三种气质。</h1>
        <p class="intro">编辑区与预览区使用相同内容。点击方案即可原尺寸切换，重点比较中英文混排、层级、行距、阅读宽度与代码表现。</p>
      </div>
      <a class="open-current" id="open-current" href="writing.html" target="_blank" rel="noreferrer">单独打开当前方案 ↗</a>
    </header>

    <nav class="choices" aria-label="排版方案" role="tablist">
      <button class="choice" style="--swatch:#b45737" data-page="writing.html" aria-selected="true" role="tab">
        <span class="choice-number">01 · EDITORIAL</span>
        <strong>温润写作型</strong>
        <small>宋体正文、无衬线标题，更松弛的中文阅读节奏</small>
      </button>
      <button class="choice" style="--swatch:#1f6d65" data-page="minimal.html" aria-selected="false" role="tab">
        <span class="choice-number">02 · MINIMAL</span>
        <strong>现代极简型</strong>
        <small>清爽无衬线、克制层级，接近现代原生笔记应用</small>
      </button>
      <button class="choice" style="--swatch:#70d5a5" data-page="developer.html" aria-selected="false" role="tab">
        <span class="choice-number">03 · TECHNICAL</span>
        <strong>程序员编辑器型</strong>
        <small>暗色、高密度、等宽优先，为源码和技术文档服务</small>
      </button>
    </nav>

    <section class="stage" aria-label="当前排版方案预览">
      <iframe id="preview" src="writing.html" title="温润写作型排版 Demo"></iframe>
    </section>
  </main>

  <script>
    const choices = [...document.querySelectorAll('.choice')];
    const preview = document.querySelector('#preview');
    const openCurrent = document.querySelector('#open-current');

    choices.forEach((choice) => {
      choice.addEventListener('click', () => {
        const page = choice.dataset.page;
        choices.forEach((item) => item.setAttribute('aria-selected', String(item === choice)));
        preview.src = page;
        preview.title = `${choice.querySelector('strong').textContent}排版 Demo`;
        openCurrent.href = page;
      });
    });
  </script>
</body>
</html>
